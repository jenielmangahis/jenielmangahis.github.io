<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeniel Mangahis — Senior Software Developer · GitHub Portfolio</title>
<meta name="description" content="Jeniel Mangahis, senior software developer (Laravel, PHP, Vue, MySQL). GitHub activity, selected projects, skills and resume.">
<meta name="theme-color" content="#05070c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305070c'/%3E%3Cpath d='M32 10l18 10v24L32 54 14 44V20z' fill='none' stroke='%237dd3fc' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%233b82f6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070c; --bg2:#0a0e17; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#e9eef8; --muted:#98a5bd; --dim:#64718a;
  --blue:#3b82f6; --blue2:#2563eb; --cyan:#7dd3fc; --ok:#34d399;
  --l0:rgba(255,255,255,.055); --l1:#17356b; --l2:#2563eb; --l3:#38bdf8; --l4:#c4ecff;
  --display:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;overflow-x:clip}
body{background:var(--bg);color:var(--text);font-family:var(--display);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--blue);color:#fff}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
.mono{font-family:var(--mono)}

/* ambient background */
.bg-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 600px at 70% 8%,rgba(59,130,246,.13),transparent 65%),
             radial-gradient(700px 500px at 5% 60%,rgba(125,211,252,.06),transparent 65%),var(--bg)}
.bg-grid::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:64px 64px;mask-image:linear-gradient(#000,transparent 85%);-webkit-mask-image:linear-gradient(#000,transparent 85%)}

/* nav */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;width:min(1120px,100% - 32px);
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px 10px 14px;
  border:1px solid var(--line);border-radius:999px;background:rgba(8,11,18,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;white-space:nowrap}
.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#12203d,#0a1224);border:1px solid var(--line2)}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 14px;border-radius:999px;color:var(--muted);font-size:14.5px;transition:.2s}
.nav-links a:hover,.nav-links a.on{color:var(--text);background:var(--panel2)}
.nav-right{display:flex;align-items:center;gap:8px}
.menu-btn{display:none;width:42px;height:42px;place-items:center;border-radius:50%;border:1px solid var(--line2);background:var(--panel);transition:background .2s}
.menu-btn:hover{background:var(--panel2)}
.mnav{position:absolute;top:calc(100% + 10px);left:0;right:0;padding:10px;border:1px solid var(--line);border-radius:26px;background:rgba(8,11,18,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:2px;animation:drop .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.mnav a{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:16px;color:var(--muted);font-size:17px;transition:.2s}
.mnav a small{font-family:var(--mono);font-size:12px;color:var(--dim)}
.mnav a:hover,.mnav a.on{color:var(--text);background:var(--panel2)}
.mnav a.on small{color:var(--cyan)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .2s,background .2s,box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 30px -8px rgba(59,130,246,.7)}
.btn-p:hover{background:#4f8ff8;transform:translateY(-2px)}
.btn-g{border:1px solid var(--line2);background:var(--panel)}
.btn-g:hover{background:var(--panel2);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.btn-sm{padding:10px 20px;font-size:15px}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:130px 0 90px}
.hero-inner{position:relative;max-width:760px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:14.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
h1{font-size:clamp(46px,8.4vw,92px);line-height:.98;letter-spacing:-.045em;font-weight:700;margin:26px 0 24px}
h1 .out{display:block;color:transparent;-webkit-text-stroke:1.5px var(--cyan);text-shadow:0 0 40px rgba(125,211,252,.25)}
h1 .fill{display:block;background:linear-gradient(180deg,#fff 30%,#a9c4f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2.1vw,21px);color:var(--muted);max-width:680px;line-height:1.7}
.lead b{color:var(--text);font-weight:500}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:34px 0 40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:900px}
.stat{padding:20px 22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));backdrop-filter:blur(6px)}
.stat b{display:block;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em;line-height:1.1}
.stat > span{display:block;margin-top:4px;color:var(--muted);font-size:14px}
.badges{margin-top:30px;color:var(--dim);font-size:15px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.badges b{color:var(--text);font-weight:500}
.scroll-cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* sections */
section.sec{padding:120px 0;position:relative;overflow-x:clip}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--cyan);display:flex;gap:12px;align-items:center;margin-bottom:18px}
.eyebrow i{font-style:normal;color:var(--dim)}
h2{font-size:clamp(34px,5.4vw,60px);line-height:1.04;letter-spacing:-.04em;font-weight:700;max-width:820px}
.sub{margin-top:18px;color:var(--muted);font-size:clamp(16px,1.8vw,19px);max-width:700px;line-height:1.7}
.big-ghost{position:absolute;right:-1vw;top:60px;font-size:clamp(110px,22vw,300px);font-weight:700;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.05);pointer-events:none;line-height:1;user-select:none}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:54px}
.card{padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));transition:border-color .3s,transform .3s}
.card:hover{border-color:rgba(125,211,252,.35);transform:translateY(-4px)}
.card .k{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(59,130,246,.15);color:var(--cyan);font-family:var(--mono);font-weight:500;margin-bottom:18px}
.card h3{font-size:23px;letter-spacing:-.02em;margin-bottom:10px}
.card p{color:var(--muted);font-size:16.5px;line-height:1.7}

/* activity */
.panel{margin-top:50px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01));padding:clamp(20px,3vw,34px)}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:22px}
.panel-h h3{font-size:20px;letter-spacing:-.02em}
.tag{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tag .dot{width:8px;height:8px;box-shadow:none;animation:none}
.tag .dot.snap{background:#f5b94c}
.heat-wrap{position:relative;overflow-x:auto;padding:36px 0 6px;margin-top:-36px;scrollbar-width:thin;scrollbar-color:#27324a transparent}
.heat{display:block;min-width:760px;width:100%;height:auto}
.heat rect.c{transition:opacity .15s,stroke .15s;cursor:pointer;opacity:0;animation:cellIn .5s forwards}
@keyframes cellIn{to{opacity:1}}
.heat rect.c:hover{stroke:#fff;stroke-width:1.2}
.heat text{fill:var(--dim);font-family:var(--mono);font-size:10px}
.tip{position:absolute;pointer-events:none;z-index:5;transform:translate(-50%,-100%);padding:7px 11px;border-radius:10px;background:#0d1322;border:1px solid var(--line2);font-size:13px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip b{color:var(--cyan);font-weight:600}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:12px;color:var(--dim);font-family:var(--mono);font-size:11.5px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.two .panel{margin-top:0}
.months{display:flex;align-items:flex-end;gap:clamp(4px,1vw,10px);height:210px;padding-top:26px}
.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;position:relative;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;min-height:0}
.mbar{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--cyan),var(--blue2));transform-origin:bottom;transform:scaleY(0);transition:transform 1s cubic-bezier(.2,.8,.2,1);min-height:3px}
.in .mbar{transform:scaleY(1)}
.mcol:hover .mbar{filter:brightness(1.25)}
.mcol .v{position:absolute;top:-22px;font-family:var(--mono);font-size:11px;color:var(--muted);opacity:0;transition:.2s;white-space:nowrap}
.mcol:hover .v,.mcol.peak .v{opacity:1}
.mcol.peak .v{color:var(--cyan)}
.mcol small{font-family:var(--mono);font-size:10.5px;color:var(--dim);height:28px;text-align:center;line-height:1.3}
.wk{display:grid;gap:11px}
.wk div{display:grid;grid-template-columns:36px 1fr 46px;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.wk .track{display:block;height:10px;border-radius:99px;background:var(--l0);overflow:hidden}
.wk .fillb{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue2),var(--cyan));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.wk .top .fillb{background:linear-gradient(90deg,var(--cyan),#fff)}
.wk em{font-style:normal;text-align:right;color:var(--text)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.fact{padding:22px 24px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.fact small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.fact b{font-size:24px;letter-spacing:-.02em}
.fact span{display:block;color:var(--muted);font-size:14px;margin-top:2px}

/* work */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:54px}
.projects > .feat{grid-column:1/-1}
.proj{display:flex;flex-direction:column;height:100%;border:1px solid var(--line);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));overflow:hidden;position:relative;transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:border-color .3s,transform .6s cubic-bezier(.2,.8,.2,1)}
.proj.tilting{transition:border-color .3s,transform .08s linear}
.proj:hover{border-color:rgba(125,211,252,.4);--ty:-5px}
.proj::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.13),transparent 55%);opacity:0;transition:opacity .3s}
.proj:hover::after{opacity:1}
.feat .proj{flex-direction:row}
.shot{background:#0b0f19;border-bottom:1px solid var(--line);overflow:hidden}
.feat .shot{flex:1.4;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.shot .bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:rgba(255,255,255,.04)}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.shot .bar span{margin-left:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.05)}
.shot .img{overflow:hidden;flex:1}
.shot img{display:block;width:100%;height:100%;aspect-ratio:1280/800;object-fit:cover;object-position:top;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.proj:hover .shot img{transform:scale(1.04)}
.proj .body{display:flex;flex-direction:column;flex:1;padding:26px 28px 28px}
.feat .body{justify-content:center;padding:clamp(28px,4vw,48px)}
.proj .meta{font-family:var(--mono);font-size:12.5px;color:var(--cyan);min-height:1em}
.proj h3{font-size:clamp(24px,2.6vw,30px);letter-spacing:-.025em;margin:6px 0 8px}
.proj p{color:var(--muted);font-size:16px;line-height:1.65}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--muted);background:var(--panel)}
.visit{margin-top:auto;padding-top:20px;color:var(--cyan);font-weight:500;display:inline-flex;gap:8px;align-items:center}
.feat .visit{margin-top:0}
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.repo{padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);display:flex;flex-direction:column;gap:8px;transition:.3s}
.repo:hover{border-color:rgba(125,211,252,.35);transform:translateY(-3px)}
.repo h4{font-size:18px;display:flex;justify-content:space-between;gap:8px}
.repo p{color:var(--muted);font-size:14.5px;flex:1}
.repo .foot{display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.lang::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cyan);margin-right:6px}
.vault{margin-top:54px;padding:clamp(28px,4vw,48px);border:1px dashed var(--line2);border-radius:28px;display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 14px,transparent 14px 28px)}
.lock{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:rgba(59,130,246,.12);border:1px solid rgba(125,211,252,.25)}
.vault h3{font-size:clamp(22px,3vw,30px);letter-spacing:-.025em;margin-bottom:8px}
.vault p{color:var(--muted);max-width:620px}
.vault .nums{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.vault .nums b{color:var(--text);font-size:19px;font-family:var(--display);margin-right:6px}

/* stack */
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:54px}
.group{padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--panel)}
.group h3{font-size:22px;letter-spacing:-.02em}
.group p{color:var(--muted);margin:6px 0 16px;font-size:15.5px}

/* contact */
.contact{text-align:center}
.contact h2{margin-inline:auto}
.contact .sub{margin-inline:auto}
.contact .cta{justify-content:center}
.avatar{width:92px;height:92px;border-radius:28px;margin:0 auto 28px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(145deg,#12203d,#0a1224);font-size:34px;font-weight:700;letter-spacing:-.03em;box-shadow:0 0 70px -10px rgba(59,130,246,.55)}
.avatar img{width:100%;height:100%;object-fit:cover}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.contact-meta{margin-top:26px;color:var(--dim);font-size:14.5px}
footer{border-top:1px solid var(--line);padding:30px 0 60px;color:var(--dim);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

/* side dots + progress */
.dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:14px}
.dots a{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.22);transition:.3s;position:relative}
.dots a.on{height:26px;background:var(--cyan);box-shadow:0 0 16px rgba(125,211,252,.6)}
.dots a:hover::after{content:attr(data-l);position:absolute;right:20px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;white-space:nowrap;padding:4px 10px;border-radius:8px;background:#0d1322;border:1px solid var(--line2)}
.prog{position:fixed;left:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:12px;padding:9px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(8,11,18,.78);backdrop-filter:blur(10px);font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.prog .bar{width:84px;height:3px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--cyan);transition:width .15s}
.prog em{font-style:normal;color:var(--cyan);min-width:62px}

/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.in .fillb{width:var(--w)}


/* ───────── scroll-driven stage, scenes and interactions ───────── */
#stage{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 52%,rgba(2,3,7,.78))}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(125,211,252,.5),rgba(59,130,246,.22) 34%,transparent 64%);animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.6)}16%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.panel,.card,.fact,.group,.repo,.sk{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* intro */
@keyframes rise{from{opacity:0;transform:translateY(34px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.rise{animation:rise 1.05s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*95ms + 120ms)}
@keyframes navIn{from{opacity:0;transform:translate(-50%,-26px)}to{opacity:1;transform:translate(-50%,0)}}
.nav{animation:navIn .9s .05s cubic-bezier(.2,.8,.2,1) both}
.hero-inner{will-change:transform,opacity}

/* custom cursor */
html.has-cursor,html.has-cursor *{cursor:none!important}
.cursor-ring,.cursor-dot{position:fixed;left:0;top:0;z-index:300;pointer-events:none;border-radius:50%;opacity:0}
.cursor-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#04131f;font-weight:500;transition:width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),margin .3s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s,opacity .3s}
.cursor-ring.on,.cursor-dot.on{opacity:1}
.cursor-ring.hot{width:62px;height:62px;margin:-31px 0 0 -31px;background:rgba(125,211,252,.14);border-color:var(--cyan)}
.cursor-ring.label{width:90px;height:90px;margin:-45px 0 0 -45px;background:var(--cyan);border-color:var(--cyan)}
.cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff;transition:opacity .2s}
.cursor-dot.hide{opacity:0!important}

/* word-by-word reveal */
.sw .w{opacity:.16;transition:opacity .2s linear}

/* fly-through (pinned kinetic type) */
.fly{position:relative;height:430vh}
.pin{position:sticky;top:0;height:100vh;overflow:hidden}
.fly .pin{display:grid;place-items:center}
.fw{position:absolute;left:50%;top:50%;width:min(1240px,94vw);transform:translate(-50%,-50%);text-align:center;font-size:clamp(50px,12vw,176px);font-weight:700;letter-spacing:-.055em;line-height:.92;opacity:0;will-change:transform,opacity,filter;pointer-events:none}
.fw.acc{color:transparent;-webkit-text-stroke:2px var(--cyan);text-shadow:0 0 60px rgba(125,211,252,.35)}
.fly-meta{position:absolute;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.fly-bar{width:min(260px,50vw);height:2px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.fly-bar i{display:block;height:100%;background:var(--cyan);transform-origin:left;transform:scaleX(0)}
.fly.static{height:auto;padding:130px 0 20px}
.fly.static .pin{position:static;height:auto;display:block;overflow:visible}
.fly.static .fw{position:static;transform:none;opacity:1;filter:none;margin:0 auto .08em;width:auto}
.fly.static .fly-meta{display:none}

/* pinned scenes */
.sec.pinned{padding:0;scroll-margin-top:-90px}
.pinwrap{position:relative}
.pinwrap > .pin{display:flex;flex-direction:column;justify-content:center;gap:20px;padding:92px 0 18px}
.gal-head{width:min(1120px,100% - 40px);margin-inline:auto}
.gal-head .eyebrow{margin-bottom:10px}
.gal-head h2{font-size:clamp(30px,3.6vw,46px)}
.gal-track{display:flex;gap:24px;width:max-content;padding:0 max(20px,calc((100vw - 1120px)/2));will-change:transform}
.gal-track .proj{width:min(560px,46vw,calc((100vh - 512px)/.625));min-width:340px;flex:none;height:auto}
.gal-track .proj .body{padding:18px 24px 20px}
.gal-track .proj h3{font-size:25px;margin:4px 0 6px}
.gal-track .proj p{font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-height:950px){ .gal-track .proj p{-webkit-line-clamp:3} .gal-track .proj{width:min(560px,46vw,calc((100vh - 540px)/.625))} }
.gal-track .tags{margin-top:10px}
.gal-track .visit{display:none}
.gal-meta{margin:0 max(20px,calc((100vw - 1120px)/2)) 0 max(330px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.gal-bar{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.gal-bar i{display:block;height:100%;background:var(--cyan);transform-origin:left;transform:scaleX(0)}
.after{padding:70px 0 120px}

.stack-pin{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:40px;align-items:center;width:min(1120px,100% - 40px);margin-inline:auto}
.stack-pin h2{font-size:clamp(30px,3.6vw,46px);margin-bottom:22px}
.sk-list{display:flex;flex-direction:column;gap:10px}
.sk{--sk:#7dd3fc;position:relative;overflow:hidden;padding:16px 22px;border:1px solid var(--line);border-radius:20px;background:rgba(10,14,23,.55);cursor:pointer;text-align:left;width:100%;transition:border-color .4s,background .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.sk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sk);opacity:0;transition:opacity .4s}
.sk h3{display:flex;justify-content:space-between;align-items:center;font-size:21px;letter-spacing:-.02em}
.sk h3 small{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--dim);transition:color .4s}
.sk .more{max-height:0;opacity:0;overflow:hidden;transition:max-height .55s cubic-bezier(.2,.8,.2,1),opacity .4s}
.sk p{color:var(--muted);font-size:15px;margin-top:8px}
.sk .tags{margin-top:12px}
.sk.on{border-color:var(--sk);background:rgba(15,22,38,.78);transform:translateX(8px)}
.sk.on::before{opacity:1}
.sk.on h3 small{color:var(--sk)}
.sk.on .more{max-height:260px;opacity:1}
.sk-side{align-self:end;justify-self:end;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-bottom:40px}
.sk-side b{display:block;font-size:44px;font-family:var(--display);letter-spacing:-.04em;color:var(--text);font-weight:700}
.groups .sk{transform:none!important}
.groups .sk .more{max-height:none;opacity:1}
.groups .sk.on{border-color:var(--sk)}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two,.facts,.cards,.groups{grid-template-columns:1fr}
  .dots{display:none}
  .fly{height:360vh}
  .stack-pin{grid-template-columns:1fr}
  .vault{grid-template-columns:1fr}
  .projects{grid-template-columns:1fr}
  .feat .proj{flex-direction:column}
  .feat .shot{border-right:0;border-bottom:1px solid var(--line)}
  .prog{display:none}
}
@media (max-width:1000px){
  .nav-links a{padding:8px 11px;font-size:14px}
}
@media (max-width:760px){
  .nav-links{display:none}
  .menu-btn{display:grid}
  .nav{padding:8px 8px 8px 12px}
}
@media (max-width:430px){
  .brand{font-size:15.5px;gap:8px}
  .logo{width:30px;height:30px;border-radius:10px}
  .nav-right .btn-sm{padding:9px 15px;font-size:14px}
  .menu-btn{width:38px;height:38px}
}
@media (min-width:761px){ .mnav{display:none} }
@media (prefers-reduced-motion:reduce){
  .rise,.nav{animation:none!important}
  .sw .w{opacity:1!important}
  .flash{display:none}
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .heat rect.c{opacity:1}
  .mbar{transform:none}
  .fillb{width:var(--w)!important}
}
</style>

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYFULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const fmt = n => Number(n).toLocaleString("en-US");
const U = d => new Date(d + "T00:00:00Z");
const nice = d => { const x = U(d); return `${DAY3[x.getUTCDay()]}, ${MON[x.getUTCMonth()]} ${x.getUTCDate()}, ${x.getUTCFullYear()}`; };
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();

function expand(start, counts){
  const t0 = U(start).getTime();
  return counts.map((count,i) => ({ date: new Date(t0 + i*864e5).toISOString().slice(0,10), count }));
}

function analyse(days){
  const total = days.reduce((a,d)=>a+d.count,0);
  const active = days.filter(d=>d.count>0).length;
  let longest=0, run=0;
  days.forEach(d => { run = d.count ? run+1 : 0; longest = Math.max(longest, run); });
  const best = days.reduce((a,d)=> d.count>a.count ? d : a, days[0]);
  const wk = Array(7).fill(0), mo = {};
  days.forEach(d => { wk[U(d.date).getUTCDay()] += d.count; const k = d.date.slice(0,7); mo[k] = (mo[k]||0) + d.count; });
  const months = Object.entries(mo).map(([k,v]) => ({ key:k, v, m:+k.slice(5)-1, y:k.slice(2,4) }));
  const peak = months.reduce((a,m)=> m.v>a.v ? m : a, months[0]);
  const topDay = wk.indexOf(Math.max(...wk));
  const nz = days.filter(d=>d.count).map(d=>d.count).sort((a,b)=>a-b);
  const q = p => nz.length ? nz[Math.min(nz.length-1, Math.floor(p*nz.length))] : 0;
  return { total, active, longest, best, wk, months, peak, topDay, th:[q(.25),q(.5),q(.75)], span:days.length };
}
/* ───────── motion helpers ───────── */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);
/* shared mutable state read by the stage every frame (no React re-renders) */
const FX = { sec:"top", local:0, skill:-1, mx:0, my:0 };
const PHASE = { top:"wireframe", fly:"fly-through", about:"solidifying", activity:"streaming", work:"shipping", stack:"modules", contact:"assembling" };
const SKILL_COL = [[125,211,252],[96,165,250],[167,139,250],[52,211,153]];
/* one rAF-throttled scroll loop that every scene subscribes to */
const subs = new Set(); let queued = false;
const runSubs = () => { queued = false; subs.forEach(f => f()); };
const kick = () => { if(!queued){ queued = true; requestAnimationFrame(runSubs); } };
addEventListener("scroll", kick, {passive:true}); addEventListener("resize", kick);
function useScrollFx(fn, deps=[]){
  useEffect(()=>{ subs.add(fn); fn(); return ()=>{ subs.delete(fn); }; }, deps);
}
function useMedia(q){
  const [m,setM] = useState(()=>matchMedia(q).matches);
  useEffect(()=>{ const mq = matchMedia(q), f = () => setM(mq.matches); mq.addEventListener("change",f); f(); return ()=>mq.removeEventListener("change",f); },[q]);
  return m;
}

const level = (c,th) => c===0 ? 0 : c<=th[0] ? 1 : c<=th[1] ? 2 : c<=th[2] ? 3 : 4;

/* ───────── hooks ───────── */
function useInView(opts={threshold:.15}){
  const ref = useRef(null), [seen,setSeen] = useState(false);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    if(!("IntersectionObserver" in window)){ setSeen(true); return; }
    const io = new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setSeen(true); io.disconnect(); } }, opts);
    io.observe(el); return ()=>io.disconnect();
  },[]);
  return [ref, seen];
}
function Reveal({children, delay=0, className="", as:Tag="div"}){
  const [ref, seen] = useInView();
  return <Tag ref={ref} className={`reveal ${seen?"in":""} ${className}`} style={{transitionDelay:delay+"ms"}}>{children}</Tag>;
}
function CountUp({to, dur=1500}){
  const [ref, seen] = useInView({threshold:.4});
  const [v,setV] = useState(0);
  const from = useRef(0);
  useEffect(()=>{
    if(!seen) return;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ setV(to); return; }
    let raf, t0;
    const a = from.current;
    const step = t => { t0 = t0 ?? t; const p = Math.min(1,(t-t0)/dur); const e = 1-Math.pow(1-p,3);
      setV(Math.round(a + (to-a)*e)); if(p<1) raf = requestAnimationFrame(step); else from.current = to; };
    raf = requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf);
  },[seen,to]);
  return <span ref={ref}>{fmt(v)}</span>;
}
function useScrollSpy(ids){
  const [cur,setCur] = useState(ids[0]);
  useEffect(()=>{
    const on = () => {
      let c = ids[0];
      ids.forEach(id => { const el = document.getElementById(id); if(el && el.getBoundingClientRect().top < innerHeight*.45) c = id; });
      setCur(c);
    };
    on(); addEventListener("scroll", on, {passive:true}); addEventListener("resize", on);
    return ()=>{ removeEventListener("scroll", on); removeEventListener("resize", on); };
  },[ids.join()]);
  return cur;
}

/* ───────── the stage: one fixed canvas that morphs as you scroll (no libraries) ───────── */
function sceneTarget(sec, l, mob){
  switch(sec){
    case "top":      return {x:mob?.5:.7,  y:mob?.3:.46, s:mob?.2:.3,  solid:0, boom:0, a:1};
    case "fly":      return {x:.5, y:.5, s:lerp(.3,1.45,l*l*l), solid:lerp(0,.3,l), boom:0, a:1-smooth(clamp((l-.72)/.28))*.9};
    case "about":    return {x:mob?.5:.76, y:mob?.2:.5, s:mob?.2:.28, solid:smooth(clamp(l*1.7)), boom:0, a:mob?.4:.7};
    case "activity": return {x:mob?.5:.9,  y:.2, s:.16, solid:.8, boom:0, a:.3};
    case "work":     return {x:.5, y:.5, s:mob?.22:.24, solid:.5, boom:0, a:.2};
    case "stack":    return {x:mob?.5:.78, y:mob?.2:.5, s:mob?.2:.3, solid:1, boom:smooth(clamp(l*4)), a:mob?.5:1};
    default:         return {x:.5, y:mob?.25:.3, s:.26, solid:1, boom:0, a:.55};
  }
}
function Stage(){

    const dist = (a,b) => Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
    let min=9; for(let i=0;i<12;i++)for(let j=i+1;j<12;j++) min=Math.min(min,dist(ico[i],ico[j]));
    const adj = (i,j) => dist(ico[i],ico[j]) < min*1.02;
    const faces = [];
    for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)for(let k=j+1;k<12;k++) if(adj(i,j)&&adj(j,k)&&adj(i,k)){

    const octE = []; for(let i=0;i<6;i++)for(let j=i+1;j<6;j++) if(dist(oct[i],oct[j])<1.5) octE.push([i,j]);

        const P=o.pts.map(p=>{const fp=persp(p[2]);return [cx+p[0]*R*fp, cy+p[1]*R*fp];});
        const light=clamp(o.nr[0]*LD[0]+o.nr[1]*LD[1]+o.nr[2]*LD[2]);
        const lit=S.lit[o.f.g], col=SKILL_COL[o.f.g];
        ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]); ctx.lineTo(P[1][0],P[1][1]); ctx.lineTo(P[2][0],P[2][1]); ctx.closePath();
        if(lit>.05){ ctx.shadowBlur=20*lit; ctx.shadowColor=`rgba(${col.join(",")},.9)`; }
        if(S.solid>.02 && (o.nr[2]>-.15 || S.solid<.6)){
          const k=Math.pow(light,1.3);
          let r=lerp(16,125,k), g=lerp(36,211,k), b=lerp(88,252,k);
          if(lit>.01){ r=lerp(r,col[0],lit); g=lerp(g,col[1],lit); b=lerp(b,col[2],lit); }
          const al=Math.min(1,S.solid*A*(.35+.5*light)+lit*.32*A);
          ctx.fillStyle=`rgba(${r|0},${g|0},${b|0},${al})`; ctx.fill();
        }
        const wa=A*(.2+.5*clamp((o.zc+1)/2))*(1-S.solid*.4)+lit*.45;
        ctx.strokeStyle=lit>.05?`rgba(${col.join(",")},${Math.min(1,wa+.3)})`:`rgba(125,211,252,${wa})`; ctx.lineWidth=1.2; ctx.stroke();
        ctx.shadowBlur=0;
      });
      // glowing vertices while it is still a wireframe
      const nodeA=A*(1-clamp(S.solid*2))*(1-clamp(S.boom*3));
      if(nodeA>.02){
        ico.forEach(v=>{ const r=rot(v,ax,ay), fp=persp(r[2]), x=cx+r[0]*R*fp, y=cy+r[1]*R*fp, al=(.35+.65*((r[2]+1)/2))*nodeA;
          const g=ctx.createRadialGradient(x,y,0,x,y,9); g.addColorStop(0,`rgba(180,225,255,${al})`); g.addColorStop(1,"rgba(180,225,255,0)");
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,9,0,6.283); ctx.fill(); ctx.fillStyle=`rgba(255,255,255,${al})`; ctx.beginPath(); ctx.arc(x,y,1.8,0,6.283); ctx.fill(); });
      }
      // inner octahedron
      const oa=A*(1-S.solid)*(1-S.boom)*.8;
      if(oa>.02){
        const P=oct.map(v=>{ const r=rot(v,-ax*1.6,-ay*1.4), fp=persp(r[2]); return {x:cx+r[0]*R*.46*fp,y:cy+r[1]*R*.46*fp,z:r[2]}; });
        octE.forEach(([i,j])=>{ ctx.strokeStyle=`rgba(96,165,250,${oa*(.3+.5*((P[i].z+P[j].z)/2+1)/2)})`; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(P[i].x,P[i].y); ctx.lineTo(P[j].x,P[j].y); ctx.stroke(); });
      }
    };

    const frame = time => {
      raf = requestAnimationFrame(frame);
      if(document.hidden) return;
      const dt = Math.min(.05, (time-last)/1000 || .016); last = time;
      const mob = w<900, T = sceneTarget(FX.sec, FX.local, mob);
      const k = REDUCED ? 1 : 1-Math.exp(-dt*(FX.sec==="fly"?9:4.2));
      ["x","y","s","solid","boom","a"].forEach(key=>{ S[key]+=(T[key]-S[key])*k; });
      for(let g=0;g<4;g++) S.lit[g]+=((FX.skill===g?1:0)-S.lit[g])*(REDUCED?1:1-Math.exp(-dt*8));
      S.mx+=(FX.mx-S.mx)*(1-Math.exp(-dt*3)); S.my+=(FX.my-S.my)*(1-Math.exp(-dt*3));
      if(!REDUCED){ const sp=FX.sec==="work"?1.6:FX.sec==="fly"?2.2:1; S.ay+=dt*.22*sp; S.ax+=dt*.15*sp; }
      draw(time);
    };
    const mv = e => { FX.mx=e.clientX/innerWidth-.5; FX.my=e.clientY/innerHeight-.5; };
    size(); addEventListener("resize",size); addEventListener("pointermove",mv,{passive:true});
    raf = requestAnimationFrame(frame);
    return ()=>{ cancelAnimationFrame(raf); removeEventListener("resize",size); removeEventListener("pointermove",mv); };
  },[]);
  return <canvas id="stage" ref={ref} aria-hidden="true"/>;
}

/* custom cursor: dot + trailing ring that grows on links and shows a label on cards */
function Cursor(){
  const ring = useRef(null), dot = useRef(null);
  useEffect(()=>{
    if(!FINE || REDUCED) return;
    document.documentElement.classList.add("has-cursor");
    let x=innerWidth/2, y=innerHeight/2, rx=x, ry=y, raf=0, shown=false, label="";
    const mv = e => {
      x=e.clientX; y=e.clientY;
      if(!shown){ shown=true; rx=x; ry=y; ring.current.classList.add("on"); dot.current.classList.add("on"); }
      const t = e.target && e.target.closest ? e.target : null;
      const lab = t && t.closest("[data-cursor]"), hot = t && t.closest("a,button,.sk,.heat rect");
      const txt = lab ? lab.getAttribute("data-cursor") : "";
      if(txt!==label){ label=txt; ring.current.textContent=txt; }
      ring.current.classList.toggle("label",!!lab); ring.current.classList.toggle("hot",!!hot && !lab); dot.current.classList.toggle("hide",!!lab);
    };
    const loop = () => { rx+=(x-rx)*.18; ry+=(y-ry)*.18; ring.current.style.transform=`translate3d(${rx}px,${ry}px,0)`; dot.current.style.transform=`translate3d(${x}px,${y}px,0)`; raf=requestAnimationFrame(loop); };
    const leave = () => { shown=false; ring.current.classList.remove("on"); dot.current.classList.remove("on"); };
    addEventListener("pointermove",mv,{passive:true}); document.addEventListener("mouseleave",leave); raf=requestAnimationFrame(loop);
    return ()=>{ cancelAnimationFrame(raf); removeEventListener("pointermove",mv); document.removeEventListener("mouseleave",leave); document.documentElement.classList.remove("has-cursor"); };
  },[]);
  return <><div className="cursor-ring" ref={ring} aria-hidden="true"/><div className="cursor-dot" ref={dot} aria-hidden="true"/></>;
}

/* paragraph whose words light up one by one as it scrolls into view */
function ScrollWords({text, className=""}){
  const ref = useRef(null), words = useMemo(()=>text.split(/\s+/),[text]);

    if(REDUCED || !ref.current) return;
    const r = ref.current.getBoundingClientRect(), vh = innerHeight, n = words.length, sp = ref.current.children;
    const p = clamp((vh*.9 - r.top)/(vh*.42 + r.height*.6));

  },[words]);
  return <p ref={ref} className={`sw ${className}`}>{words.map((w,i)=><span className="w" key={i}>{w}{" "}</span>)}</p>;
}

const FLY = ["Every product","starts as","one small","commit."];
function Fly(){

/* ───────── contribution heatmap ───────── */
function Heatmap({days, st}){
  const [tip,setTip] = useState(null);
  const wrap = useRef(null);
  const CELL=12, GAP=3, L=30, T=20, STEP=CELL+GAP;
  useEffect(()=>{ const el = wrap.current; if(el) el.scrollLeft = el.scrollWidth; },[days.length]);
  const first = U(days[0].date).getUTCDay();
  const cells = [...Array(first).fill(null), ...days];
  const weeks = Math.ceil(cells.length/7);
  const W = L + weeks*STEP, H = T + 7*STEP;
  const labels = []; let lastCol=-9, lastM=-1;
  for(let c=0;c<weeks;c++){ const d = cells.slice(c*7,c*7+7).find(Boolean); if(!d) continue; const mo = U(d.date).getUTCMonth();
    if(mo!==lastM && c-lastCol>=3){ labels.push({c,t:MON[mo]}); lastCol=c; } lastM=mo; }
  const show = (e,d) => { const r = e.currentTarget.getBoundingClientRect(), w = wrap.current.getBoundingClientRect();
    setTip({x:r.left-w.left+wrap.current.scrollLeft+r.width/2, y:r.top-w.top-8, d}); };
  return (
    <div className="heat-wrap" ref={wrap} onMouseLeave={()=>setTip(null)}>
      <svg className="heat" viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Contribution graph: ${fmt(st.total)} contributions across ${st.active} active days in the last year`}>
        {labels.map(l=><text key={l.c} x={L+l.c*STEP} y={10}>{l.t}</text>)}
        {[1,3,5].map(i=><text key={i} x={0} y={T+i*STEP+9}>{DAY3[i]}</text>)}
        {cells.map((d,i)=>{ if(!d) return null; const c=Math.floor(i/7), r=i%7, lv=level(d.count,st.th);
          return <rect key={d.date} className="c" x={L+c*STEP} y={T+r*STEP} width={CELL} height={CELL} rx="3"
            fill={`var(--l${lv})`} style={{animationDelay:(c*14)+"ms"}}
            onMouseEnter={e=>show(e,d)} onClick={e=>show(e,d)}/>; })}
      </svg>
      {tip && <div className="tip" style={{left:tip.x,top:tip.y}}><b>{tip.d.count===0?"No":fmt(tip.d.count)} contribution{tip.d.count===1?"":"s"}</b> · {nice(tip.d.date)}</div>}
      <div className="legend"><span>Less</span>{[0,1,2,3,4].map(i=><i key={i} style={{background:`var(--l${i})`}}/>)}<span>More</span></div>
    </div>
  );
}

    if(hudPhase.current){ hudPhase.current.textContent = PHASE[sec]||sec; hudPct.current.textContent = pct+"%"; hudBar.current.style.width = pct+"%"; }
    if(!REDUCED){
      const hi = document.querySelector(".hero-inner");
      if(hi){ const k = clamp(scrollY/(vh*.8)); hi.style.opacity = (1-k).toFixed(3); hi.style.transform = `translate3d(0,${(-k*70).toFixed(1)}px,0)`; }
      document.querySelectorAll(".big-ghost").forEach(g=>{ const r = g.parentElement.getBoundingClientRect(); g.style.transform = `translate3d(0,${((r.top+r.height/2-vh/2)*-.12).toFixed(1)}px,0)`; });
    }
  },[driverIds.join()]);
  /* card tilt + magnetic buttons (mouse only) */
  useEffect(()=>{
    if(!FINE || REDUCED) return;
    let tEl=null, mEl=null;
    const reset = el => { el.classList.remove("tilting"); el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); };
    const move = e => {
      const tg = e.target && e.target.closest ? e.target : null; if(!tg) return;
      const c = tg.closest(".proj"); if(tEl && tEl!==c){ reset(tEl); tEl=null; }
      if(c){ const r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
        c.classList.add("tilting"); c.style.setProperty("--ry",((px-.5)*10).toFixed(2)+"deg"); c.style.setProperty("--rx",((.5-py)*8).toFixed(2)+"deg");
        c.style.setProperty("--gx",(px*100).toFixed(1)+"%"); c.style.setProperty("--gy",(py*100).toFixed(1)+"%"); tEl=c; }
      const b = tg.closest(".btn"); if(mEl && mEl!==b){ mEl.style.transform=""; mEl=null; }
      if(b){ const r=b.getBoundingClientRect(); b.style.transform=`translate(${(((e.clientX-r.left)/r.width-.5)*10).toFixed(1)}px,${(((e.clientY-r.top)/r.height-.5)*8).toFixed(1)}px)`; mEl=b; }
    };
    addEventListener("pointermove",move,{passive:true});
    return ()=>removeEventListener("pointermove",move);
  },[]);
  const num = id => String(secs.findIndex(s=>s.id===id)+1).padStart(2,"0");

  const copy = async () => { try{ await navigator.clipboard.writeText(GH); setCopied(true); setTimeout(()=>setCopied(false),1800); }catch(e){} };
  const private_ = pubRepos===0;

  const extras = <>
    {hasPublic && <div className="repos" style={{marginTop:hasProjects?40:54}}>{repos.map((r,i)=>(
      <Reveal key={r.id} delay={i*50}><a className="repo" data-cursor="Open" href={r.html_url} target="_blank" rel="noopener noreferrer">
        <h4>{r.name}<Ext/></h4><p>{r.description||"No description yet."}</p>
        <div className="foot">{r.language&&<span className="lang">{r.language}</span>}<span>★ {r.stargazers_count}</span><span>⑂ {r.forks_count}</span></div></a></Reveal>))}</div>}
    {!hasProjects && !hasPublic && (
      <Reveal className="vault">
        <div className="lock"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="#7dd3fc"/></svg></div>
        <div><h3>Built behind closed doors.</h3>
          <p>{pubRepos} public repositories, {fmt(st.total)} contributions. The work happens in private repositories, so the activity graph above is the proof of work. Public repositories appear here automatically as soon as they exist.</p>
          <div className="nums"><span><b>{pubRepos}</b>public repos</span><span><b>{fmt(st.total)}</b>contributions</span><span><b>{st.active}</b>active days</span></div></div>
      </Reveal>)}
  </>;

  return (
    <>
      <Stage/><div className="vignette" aria-hidden="true"/><Cursor/>
      {flash>0 && <div className="flash" key={flash} aria-hidden="true"/>}
      <nav className="nav" aria-label="Primary">
        <a className="brand" href="#top" onClick={()=>setOpen(false)}><span className="logo"><Mark/></span>{name}</a>
        <div className="nav-links">{secs.map(s=><a key={s.id} href={"#"+s.id} className={cur===s.id?"on":""} aria-current={cur===s.id?"true":undefined}>{s.l}</a>)}</div>
        <div className="nav-right">
          <a className="btn btn-p btn-sm" href="#contact">Let’s talk</a>
          <button className="menu-btn" aria-label={open?"Close menu":"Open menu"} aria-expanded={open} aria-controls="mnav" onClick={()=>setOpen(o=>!o)}>
            {open
              ? <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
              : <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>}
          </button>
        </div>
        {open && <div className="mnav" id="mnav">{secs.map((s,i)=><a key={s.id} href={"#"+s.id} className={cur===s.id?"on":""} onClick={()=>setOpen(false)}>{s.l}<small>{String(i+1).padStart(2,"0")}</small></a>)}</div>}
      </nav>

      <div className="dots" aria-hidden="true">
        <a href="#top" data-l="Intro" className={cur==="top"?"on":""}/>
        {secs.map(s=><a key={s.id} href={"#"+s.id} data-l={s.l} className={cur===s.id?"on":""}/>)}
      </div>
      <div className="prog" aria-hidden="true"><span>build</span><span className="bar"><i ref={hudBar} style={{width:"0%"}}/></span><em ref={hudPhase}>wireframe</em><span ref={hudPct}>0%</span></div>

      <header className="hero" id="top">
        <div className="wrap">
          <div className="hero-inner">
            <span className="chip rise" style={{"--i":0}}><span className="dot"/>{C.availability || <>{C.role ? C.role+" · " : "GitHub · "}<span className="mono">@{C.username}</span></>}</span>
            <h1><span className="out rise" style={{"--i":1}}>Shipping daily.</span><span className="fill rise" style={{"--i":2}}>{private_?"Mostly in private.":"Always in motion."}</span></h1>
            <p className="lead rise" style={{"--i":3}}>
              <b>{fmt(st.total)} contributions</b> in the last year across <b>{st.active} active days</b>, with a best run of <b>{st.longest} days in a row</b>
              {private_ ? " — nearly all of it inside private repositories. This page is the public window into that work." : ". This page is a live window into that work."}
            </p>
            <div className="cta rise" style={{"--i":4}}>
              <a className="btn btn-p" href="#activity">See the activity <Arrow/></a>
              <a className="btn btn-g" href={GH} target="_blank" rel="noopener noreferrer">Open GitHub <Ext/></a>
            </div>
            <div className="stats rise" style={{"--i":5}}>
              <div className="stat"><b><CountUp to={st.total}/></b><span>contributions, last 12 months</span></div>
              <div className="stat"><b><CountUp to={st.active}/></b><span>active days out of {st.span}</span></div>
              <div className="stat"><b><CountUp to={st.longest}/> days</b><span>longest streak</span></div>
              <div className="stat"><b><CountUp to={st.best.count}/></b><span>contributions on a single day</span></div>
            </div>
            <p className="badges rise" style={{"--i":6}}><span>Earned</span> {SNAP.achievements.map((a,i)=><React.Fragment key={a}>{i>0&&<span>·</span>}<b>{a}</b></React.Fragment>)}</p>
          </div>
        </div>
        <span className="scroll-cue">scroll</span>
      </header>

      <Fly/>

      <section className="sec" id="about"><div className="wrap">
        <span className="big-ghost" aria-hidden="true">{num("about")}</span>
        <Reveal><div className="eyebrow"><span>{num("about")}</span><i>/</i><span>about</span></div>
          <h2>Consistent work, written in commits.</h2>
          <ScrollWords className="sub" text={bio || `${name} builds software and keeps a steady rhythm doing it. These are the signals the GitHub record shows on its own.`}/>
          {loc && <p className="mono" style={{marginTop:14,color:"var(--dim)",fontSize:13}}>{loc}</p>}</Reveal>
        <div className="cards">
          <Reveal className="card"><div className="k">A</div><h3>Steady, not sporadic</h3><p>Active on {st.active} of the last {st.span} days ({Math.round(st.active/st.span*100)}%), with a longest streak of {st.longest} days and a peak of {fmt(st.best.count)} contributions in one day.</p></Reveal>
          <Reveal className="card" delay={80}><div className="k">B</div><h3>Ships through pull requests</h3><p>Holds GitHub’s <b style={{color:"var(--text)",fontWeight:500}}>Pull Shark</b> achievement, awarded for pull requests that were opened and merged.</p></Reveal>
          <Reveal className="card" delay={160}><div className="k">C</div><h3>{private_?"Private by default":"Public and private"}</h3><p>{private_?`Most of the work lives in private repositories, which is why the public list is quiet while the graph stays busy. ${followers} developers follow along.`:`${pubRepos} public repositories plus private work, with ${followers} followers.`}</p></Reveal>
          <Reveal className="card" delay={240}><div className="k">D</div><h3>Part of open-source history</h3><p>An <b style={{color:"var(--text)",fontWeight:500}}>Arctic Code Vault Contributor</b>: code from this account was preserved in GitHub’s 2020 archive of public repositories.</p></Reveal>
        </div>
      </div></section>

      <section className="sec" id="activity"><div className="wrap">
        <span className="big-ghost" aria-hidden="true">{num("activity")}</span>
        <Reveal><div className="eyebrow"><span>{num("activity")}</span><i>/</i><span>activity</span></div>
          <h2>The last year, day by day.</h2>
          <p className="sub">Every square is a day. Hover or tap one to see what it holds. This includes private work, so the graph shows the real shape of the year.</p></Reveal>
        <Activity days={days} st={st} source={source}/>
      </div></section>

      <section className={"sec"+(gallery?" pinned":"")} id="work">
        {gallery
          ? <Gallery projects={C.projects} GH={GH} head={<><div className="eyebrow"><span>{num("work")}</span><i>/</i><span>selected work</span></div><h2>Proof, not promises.</h2></>}/>
          : <div className="wrap">
              <span className="big-ghost" aria-hidden="true">{num("work")}</span>
              <Reveal><div className="eyebrow"><span>{num("work")}</span><i>/</i><span>selected work</span></div>
                <h2>{hasProjects||hasPublic ? "Proof, not promises." : "Where the work lives."}</h2>
                {(hasProjects||hasPublic) && <p className="sub">{hasProjects?"Live products I’ve worked on. Open any card to visit the site.":"Repositories I’ve built and maintained."}</p>}</Reveal>
              {hasProjects && <div className="projects">{C.projects.map((p,i)=>(
                <Reveal key={p.title} delay={(i%2)*80} className={i===0?"feat":""}><ProjectCard p={p} GH={GH}/></Reveal>))}</div>}
              {extras}
            </div>}
        {gallery && (hasPublic || !hasProjects) && <div className="wrap after">{extras}</div>}
      </section>

      {hasSkills && <section className={"sec"+(stackPinned?" pinned":"")} id="stack"><Stack skills={C.skills} n={num("stack")} pinned={stackPinned}/></section>}

      <section className="sec contact" id="contact"><div className="wrap">
        <Reveal>
          <div className="avatar"><img src={`https://github.com/${C.username}.png?size=200`} alt={`${name} on GitHub`} onError={e=>{e.currentTarget.replaceWith(document.createTextNode(initials(name)));}}/></div>
          <div className="eyebrow" style={{justifyContent:"center"}}><span>{num("contact")}</span><i>/</i><span>contact</span></div>
          <h2>Want to see more, or work together?</h2>
          <p className="sub">The best way to follow along is GitHub. {followers} people already do.{C.email?" For anything else, send a note.":""}</p>
          <div className="cta">
            <a className="btn btn-p" href={GH} target="_blank" rel="noopener noreferrer">Follow on GitHub <Ext/></a>
            {C.email && <a className="btn btn-g" href={"mailto:"+C.email}>Email me</a>}
            {C.resume && <a className="btn btn-g" href={C.resume} target="_blank" rel="noopener noreferrer">View resume <Ext/></a>}
            <button className="btn btn-g" onClick={copy}>{copied?"Copied ✓":"Copy profile link"}</button>
          </div>
          <div className="links">
            {C.linkedin && <a className="btn btn-g btn-sm" href={C.linkedin} target="_blank" rel="noopener noreferrer">LinkedIn <Ext/></a>}
            {C.website && <a className="btn btn-g btn-sm" href={C.website} target="_blank" rel="noopener noreferrer">Website <Ext/></a>}
          </div>
          <p className="contact-meta mono">github.com/{C.username}{C.email?` · ${C.email}`:""}{loc?` · ${loc}`:""}</p>
        </Reveal>
      </div></section>

      <footer><div className="wrap">
        <span>© {new Date().getFullYear()} {name}</span>
        <span>Built with React in a single HTML file · data from GitHub ({source})</span>
      </div></footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
